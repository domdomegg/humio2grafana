name: CI

on:
  push:
    branches:
    - '**'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*', current]
    env:
      CI: true
    steps:
    - name: Checkout ${{ github.sha }}
      uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Ensure no git changes after build (keep src and dist in sync)
      run: |
        git add .
        NUMBER_OF_FILES_CHANGED=$(git diff --name-only HEAD | wc -l)
        if [[ $NUMBER_OF_FILES_CHANGED -gt 0 ]]; then git diff --stat HEAD; git diff HEAD | head -50; exit 1; fi